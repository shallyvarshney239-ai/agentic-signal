services:
  ollama:
    image: ollama/ollama:latest
    container_name: agentic-signal-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=60m
      - OLLAMA_HOST=0.0.0.0
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

  init-models:
    image: ollama/ollama:latest
    container_name: agentic-signal-init-models
    depends_on:
      ollama:
        condition: service_started
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Waiting for Ollama to be ready..."
        until ollama list > /dev/null 2>&1; do sleep 2; done
        echo "Pulling phi4-mini model..."
        ollama pull phi4-mini
        echo "Model pull complete."
    environment:
      - OLLAMA_HOST=ollama:11434
    restart: "no"

  app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: agentic-signal-app
    depends_on:
      ollama:
        condition: service_started
    expose:
      - "8000"
      - "8080"
    environment:
      - HEADLESS=true
    restart: unless-stopped

  caddy:
    image: caddy:latest
    container_name: agentic-signal-caddy
    ports:
      - "3000:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
    depends_on:
      - app
    restart: unless-stopped

volumes:
  ollama-data: